<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tako creature card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1B2E}a:hover{color:#5A2A4A}
.notch{clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}
.px{position:absolute;display:block;image-rendering:pixelated}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; padding: 48px; display: flex; align-items: center; justify-content: center; font-family: 'Pixelify Sans', monospace; color: #1F1B2E; background: #241E38">
  <div class="notch" style="width: 900px; display: flex; gap: 36px; padding: 32px; background: #FFF6E5; border: 6px solid #8A2B4A; box-shadow: inset 0 -10px 0 #EBDCC2">

    <div style="width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px">
      <div class="notch" style="position: relative; width: 340px; height: 340px; box-sizing: border-box; background: #F2D49B; border: 6px solid #B88A4A; overflow: hidden">
        <!-- sand speckles -->
        <div style="position: absolute; left: 30px; top: 40px; width: 6px; height: 6px; background: #D9B675; box-shadow: 220px 30px 0 #D9B675, 60px 240px 0 #D9B675, 250px 230px 0 #D9B675"></div>
        <!-- shadow -->
        <div style="position: absolute; left: 70px; top: 284px; width: 200px; height: 12px; background: #1F1B2E; opacity: 0.18"></div>
        <!-- the creature: octopus + crab shell + duck bill + claw + crab legs -->
        <img class="px" alt="" src="/_blob/efb8c92a46a9c8deb90f7d627b537283" style="left: 39px; top: 50px; width: 220px">
        <img class="px" alt="" src="/_blob/f5ec4b91929c8476c14dcd08c4342911" style="left: 79px; top: 30px; width: 140px">
        <img class="px" alt="" src="/_blob/7847289caf7cf2ae4bcf94e390a038dc" style="left: 119px; top: 150px; width: 60px">
        <img class="px" alt="" src="/_blob/a1e9b98ea615274985f3b92feb4d6151" style="left: 219px; top: 160px; width: 70px">
        <img class="px" alt="" src="/_blob/12a3f9a7dc07d10143991fc96cfd17ed" style="left: 89px; top: 250px; width: 120px">
      </div>
      <p style="margin: 0; font-size: 14px; color: #4A4458; text-align: center">Placeholder pixel art — your drawings replace it</p>
    </div>

    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 16px; color: #4A4458">You became…</span>
        <h1 style="margin: 0; font-size: 44px; font-weight: 700; line-height: 1.05">The Quacking Crabtopus</h1>
      </div>

      <div style="display: flex; gap: 12px">
        <div class="notch" style="flex: 1; padding: 12px 14px; background: #1F1B2E; color: #FFF6E5">
          <div style="font-size: 14px; color: #CFC6E3">Survived</div>
          <div style="font-size: 30px; font-weight: 700">12:48</div>
        </div>
        <div class="notch" style="flex: 1; padding: 12px 14px; background: #1F1B2E; color: #FFF6E5">
          <div style="font-size: 14px; color: #CFC6E3">Level</div>
          <div style="font-size: 30px; font-weight: 700">14</div>
        </div>
        <div class="notch" style="flex: 1; padding: 12px 14px; background: #1F1B2E; color: #FFF6E5">
          <div style="font-size: 14px; color: #CFC6E3">Killed by</div>
          <div style="font-size: 30px; font-weight: 700">Seagull</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 16px; font-weight: 700">Mutations</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <span style="padding: 6px 10px; font-size: 15px; background: #B23A26; color: #FFFFFF">Crab Shell</span>
          <span style="padding: 6px 10px; font-size: 15px; background: #B23A26; color: #FFFFFF">Crab Legs</span>
          <span style="padding: 6px 10px; font-size: 15px; background: #B23A26; color: #FFFFFF">Claw Lv 2</span>
          <span style="padding: 6px 10px; font-size: 15px; background: #8A6110; color: #FFFFFF">Duck Bill</span>
          <span style="padding: 6px 10px; font-size: 15px; background: #6B4A9E; color: #FFFFFF">Big Mouth</span>
          <span style="padding: 6px 10px; font-size: 15px; background: #6B4A9E; color: #FFFFFF">Extra Eyes</span>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: auto">
        <button class="notch" style="flex: 1; padding: 14px 20px; font-family: inherit; font-size: 20px; font-weight: 700; background: #FFD84D; color: #1F1B2E; border: 6px solid #8A6110; box-shadow: inset 0 -6px 0 #E0A82A; cursor: pointer">New run</button>
        <button class="notch" style="flex: 1; padding: 14px 20px; font-family: inherit; font-size: 20px; font-weight: 700; background: #FFF6E5; color: #1F1B2E; border: 6px solid #8A2B4A; box-shadow: inset 0 -6px 0 #EBDCC2; cursor: pointer">Save card</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
